<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review your HawkerHub demonstration cart">
  <title>Cart | HawkerHub</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/cart.css">
  <script src="../js/shared.js" defer></script>
  <script src="../js/cart.js" defer></script>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="page-shell" id="mainContent">
    <div class="page-heading"><div><span class="eyebrow">Your selections</span><h1>Shopping cart</h1><p>Items are grouped by stall so separate orders remain clear.</p></div></div>

      <section id="cartGroups" aria-label="Cart items"></section>
      <aside class="card cart-summary" id="cartSummary"></aside>

  </main>
  <div id="siteFooter"></div>
