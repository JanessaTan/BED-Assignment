<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | HawkerHub</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/scope.css">
  <script src="../JS/api.js" defer></script>
  <script src="../JS/Login.js" defer></script>
</head>
<body class="scope-page">
  <main class="auth-shell">
    <section class="auth-story" aria-label="About HawkerHub">
      <a href="../index.html">HawkerHub</a>
      <div>
        <p class="scope-kicker" style="color:#faeeda">One secure account</p>
        <h1>Your hawker favourites, managed simply.</h1>
        <p>Customers browse. Vendors manage. Administrators keep every account in order.</p>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <p class="scope-kicker">Welcome back</p>
        <h2>Log in</h2>
        <p>Use the email and password for your assigned role.</p>
        <div id="loginStatus" class="status-box" hidden role="alert"></div>
        <form id="loginForm" class="scope-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button id="loginButton" class="scope-btn" type="submit">Log in securely</button>
        </form>
        <p class="auth-switch">New customer? <a href="register.html">Create an account</a></p>
        <p class="auth-switch"><a href="Menu.html">Continue browsing as a guest</a></p>
      </div>
    </section>
  </main>
</body>
</html>
