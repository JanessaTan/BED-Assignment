<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promotions – HawkerHub</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/promotion.css">
</head>
<body>
  <script src="../JS/shared.js"></script>
  <script>
    renderHeader("promotions");
  </script>

  <main class="page-shell">
    <header class="page-header">
      <div class="page-header__content">
        <p class="eyebrow">Save more at HawkerHub</p>

      <a href="Stalls.html" class="btn outline mobile-full">Explore stalls</a>

    <div id="promotionStatus" class="status" role="status" aria-live="polite">Loading promotions...</div>

  </main>

  <script src="../JS/promotion.js"></script>
