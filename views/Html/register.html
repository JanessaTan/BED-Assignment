<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – HawkerHub</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card card">

      <div class="login-brand">
        <h1>Hawker<span>Hub</span></h1>
        <p class="login-subtitle">Create an account to order and save your history</p>
      </div>

      <form id="registerForm" class="login-form active">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required minlength="6">

        <p class="form-error" id="registerError"></p>
        <button type="submit" class="btn primary full-width">Create account</button>
        <p class="form-footer">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </form>

    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
