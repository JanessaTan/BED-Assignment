<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage promotions | HawkerHub</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/scope.css">
  <script src="../JS/api.js" defer></script>
  <script src="../JS/shared.js" defer></script>
  <script src="../JS/vendor-promotions.js" defer></script>
</head>
<body class="scope-page">
  <main class="scope-main">
    <header class="scope-hero">
      <div>
        <p class="scope-kicker">Vendor workspace</p>
        <h1>Promotion management</h1>
        <p>Create percentage or fixed offers. Final prices are always calculated by the backend.</p>
      </div>
      <button id="newPromotionButton" class="scope-btn" type="button">Add promotion</button>
    </header>
    <div id="vendorPromotionStatus" class="status-box" role="status">Loading your promotions...</div>
    <section class="scope-card full">
      <div class="field" style="max-width:360px">
        <label for="promotionStallFilter">Stall</label>
        <select id="promotionStallFilter"></select>
      </div>
      <div class="scope-table-wrap">
        <table class="scope-table">
          <thead><tr><th>Promotion</th><th>Discount</th><th>Period</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="promotionRows"></tbody>
        </table>
      </div>
    </section>
    <section id="promotionEditor" class="scope-card full" hidden>
      <h2 id="promotionEditorTitle">Add promotion</h2>
      <div id="promotionFormStatus" class="status-box" hidden role="alert"></div>
      <form id="promotionForm" class="scope-form">
        <input id="editPromotionId" type="hidden">
        <div class="form-grid">
          <div class="field">
            <label for="promotionStallId">Stall</label>
            <select id="promotionStallId" name="stallId" required></select>
          </div>
          <div class="field">
            <label for="promotionItemId">Menu item <span>(optional)</span></label>
            <select id="promotionItemId" name="itemId"><option value="">Entire stall</option></select>
          </div>
          <div class="field">
            <label for="promotionName">Promotion name</label>
            <input id="promotionName" name="promotionName" minlength="2" maxlength="100" required>
          </div>
          <div class="field">
            <label for="discountType">Discount type</label>
            <select id="discountType" name="discountType" required>
              <option value="PERCENT">Percentage</option>
              <option value="FIXED">Fixed amount</option>
            </select>
          </div>
          <div class="field">
            <label for="discountValue">Discount value</label>
            <input id="discountValue" name="discountValue" type="number" min="0.01" step="0.01" required>
          </div>
          <div class="field">
            <label for="promotionActive">Status</label>
            <select id="promotionActive" name="isActive">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
          <div class="field">
            <label for="startDate">Start date and time</label>
            <input id="startDate" name="startDate" type="datetime-local" required>
          </div>
          <div class="field">
            <label for="endDate">End date and time</label>
            <input id="endDate" name="endDate" type="datetime-local" required>
          </div>
          <div class="field full">
            <label for="promotionDescription">Description</label>
            <textarea id="promotionDescription" name="description" maxlength="500"></textarea>
          </div>
        </div>
        <div class="scope-actions">
          <button id="savePromotion" class="scope-btn" type="submit">Save promotion</button>
          <button id="cancelPromotion" class="scope-btn ghost" type="button">Cancel</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
