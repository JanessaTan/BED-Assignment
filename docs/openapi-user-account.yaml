openapi: 3.0.3
info:
  title: HawkerHub User Account API
  version: 1.0.0
  description: User registration, authentication, profile and administrator account-management endpoints matching the current Express routes.
servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Authentication
  - name: Users
  - name: Hawker Centres
  - name: Stalls
  - name: Cuisines
  - name: Menu Items
  - name: Promotions

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a public account
      description: Creates a Customer or Vendor account, hashes the password and returns a JWT with safe user details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: Verifies the identifier and password and returns a JWT for an active account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Retrieve the authenticated account
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated account returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSuccess' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: Confirms logout. The browser removes the JWT because this implementation uses stateless JWT authentication.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logout confirmed
        '401': { $ref: '#/components/responses/AuthenticationError' }

  /users/me:
    get:
      tags: [Users]
      summary: Retrieve the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSuccess' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /users:
    get:
      tags: [Users]
      summary: Retrieve user accounts
      description: Administrator only.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: role
          schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: User list returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Users retrieved }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
    post:
      tags: [Users]
      summary: Create a user account
      description: Administrator only. Supports all configured roles.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Retrieve one user
      description: The account owner or an Administrator can retrieve the account.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Users]
      summary: Update a user account
      description: Users may update their own allowlisted profile fields. Administrators may also change the role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      tags: [Users]
      summary: Deactivate a user account
      description: Performs soft deletion by changing the account status to Deactivated.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account deactivated
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Users]
      summary: Change account status
      description: Administrator only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Active, Deactivated, Suspended]
      responses:
        '200':
          description: Account status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /hawker-centres:
    get:
      tags: [Hawker Centres]
      summary: Search and retrieve active hawker centres
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: town, schema: { type: string, maxLength: 80 } }
        - { in: query, name: crowdLevel, schema: { type: string, enum: [Low, Moderate, High, Very High] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Hawker centres returned }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Hawker Centres]
      summary: Create a hawker centre
      description: Administrator only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HawkerCentreRequest' }
      responses:
        '201': { description: Hawker centre created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }

  /hawker-centres/location-search:
    get:
      tags: [Hawker Centres]
      summary: Validate a Singapore location through OpenStreetMap Nominatim
      description: The third-party API is invoked by the backend with a five-second timeout.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200': { description: Matching Singapore locations returned }
        '400': { $ref: '#/components/responses/ValidationError' }
        '502': { description: Location service unavailable }

  /hawker-centres/{centreId}:
    parameters:
      - { in: path, name: centreId, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Hawker Centres]
      summary: Retrieve one hawker centre
      responses:
        '200': { description: Hawker centre returned }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Hawker Centres]
      summary: Update a hawker centre
      description: Administrator only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HawkerCentreRequest' }
      responses:
        '200': { description: Hawker centre updated }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Hawker Centres]
      summary: Deactivate a hawker centre
      description: Administrator only.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Hawker centre deactivated }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /hawker-centres/{centreId}/stalls:
    get:
      tags: [Hawker Centres]
      summary: Retrieve active stalls belonging to a hawker centre
      parameters:
        - { in: path, name: centreId, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Centre stalls returned }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /stalls:
    get:
      tags: [Stalls]
      summary: Retrieve active stalls
      parameters:
        - { in: query, name: centreId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: cuisineId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: hygieneGrade, schema: { type: string, enum: [A, B, C, D] } }
      responses:
        '200': { description: Stalls returned }
    post:
      tags: [Stalls]
      summary: Create an owned stall
      description: Vendor or Administrator only. A Vendor is taken from the JWT identity.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StallRequest' }
      responses:
        '201': { description: Stall created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }

  /stalls/mine:
    get:
      tags: [Stalls]
      summary: Retrieve stalls owned by the authenticated Vendor
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Owned stalls returned }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }

  /stalls/{stallId}:
    parameters:
      - { in: path, name: stallId, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Stalls]
      summary: Retrieve one stall
      responses:
        '200': { description: Stall returned }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Stalls]
      summary: Update an owned stall
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StallRequest' }
      responses:
        '200': { description: Stall updated }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Stalls]
      summary: Deactivate an owned stall
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Stall deactivated }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /cuisines:
    get:
      tags: [Cuisines]
      summary: Retrieve cuisines
      responses:
        '200': { description: Cuisines returned }
    post:
      tags: [Cuisines]
      summary: Create a cuisine
      description: Administrator only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuisineRequest' }
      responses:
        '201': { description: Cuisine created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }

  /cuisines/{cuisineId}:
    parameters:
      - { in: path, name: cuisineId, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Cuisines]
      summary: Retrieve one cuisine
      responses:
        '200': { description: Cuisine returned }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Cuisines]
      summary: Update a cuisine
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuisineRequest' }
      responses:
        '200': { description: Cuisine updated }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Cuisines]
      summary: Delete an unused cuisine
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cuisine deleted }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /menu-items:
    get:
      tags: [Menu Items]
      summary: Retrieve and filter menu items
      parameters:
        - { in: query, name: stallId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: cuisineId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: available, schema: { type: boolean } }
        - { in: query, name: sort, schema: { type: string, enum: [recommended, price_asc, price_desc, name] } }
      responses:
        '200': { description: Menu items returned }
    post:
      tags: [Menu Items]
      summary: Create a menu item for an owned stall
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemRequest' }
      responses:
        '201': { description: Menu item created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }

  /menu-items/{menuItemId}:
    parameters:
      - { in: path, name: menuItemId, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Menu Items]
      summary: Retrieve one menu item
      responses:
        '200': { description: Menu item returned }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Menu Items]
      summary: Update a menu item for an owned stall
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemRequest' }
      responses:
        '200': { description: Menu item updated }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Menu Items]
      summary: Make a menu item unavailable
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Menu item made unavailable }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /promotions:
    get:
      tags: [Promotions]
      summary: Retrieve and filter promotions
      parameters:
        - { in: query, name: centreId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: stallId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: active, schema: { type: boolean } }
      responses:
        '200': { description: Promotions returned }
    post:
      tags: [Promotions]
      summary: Create a promotion for an owned stall
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionRequest' }
      responses:
        '201': { description: Promotion created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }

  /promotions/{promotionId}:
    parameters:
      - { in: path, name: promotionId, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Promotions]
      summary: Retrieve one promotion
      responses:
        '200': { description: Promotion returned }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Promotions]
      summary: Update a promotion for an owned stall
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionRequest' }
      responses:
        '200': { description: Promotion updated }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Promotions]
      summary: Deactivate a promotion for an owned stall
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Promotion deactivated }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: integer, minimum: 1 }

  schemas:
    Role:
      type: string
      enum: [Customer, Vendor, NEA Officer, Operator, Administrator]

    RegisterRequest:
      type: object
      required: [fullName, email, password, confirmPassword, role, termsAccepted]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120, example: Alice Tan }
        email: { type: string, format: email, maxLength: 254, example: alice@example.sg }
        phone: { type: string, pattern: '^[689]\d{7}$', nullable: true, example: '91234567' }
        password: { type: string, minLength: 8, maxLength: 72, format: password, example: Secure123 }
        confirmPassword: { type: string, minLength: 8, maxLength: 72, format: password, example: Secure123 }
        role: { type: string, enum: [Customer, Vendor] }
        termsAccepted: { type: string, enum: ['true'], example: 'true' }

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 2, maxLength: 254, example: alice@example.sg }
        password: { type: string, minLength: 1, maxLength: 72, format: password }

    AdminCreateUserRequest:
      type: object
      required: [fullName, email, password, role]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, pattern: '^[689]\d{7}$', nullable: true }
        password: { type: string, minLength: 8, maxLength: 72, format: password }
        role: { $ref: '#/components/schemas/Role' }

    UpdateUserRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, pattern: '^[689]\d{7}$', nullable: true }
        role: { $ref: '#/components/schemas/Role' }

    HawkerCentreRequest:
      type: object
      required: [name, town, address]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        town: { type: string, minLength: 2, maxLength: 80 }
        address: { type: string, minLength: 5, maxLength: 250 }
        nearestMrt: { type: string, maxLength: 100 }
        openingHours: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }

    StallRequest:
      type: object
      required: [centreId, name, unitNumber]
      properties:
        centreId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 150 }
        unitNumber: { type: string, minLength: 2, maxLength: 20 }
        description: { type: string, maxLength: 500 }
        openingHours: { type: string, maxLength: 120 }
        cuisineIds:
          type: array
          maxItems: 20
          items: { type: integer, minimum: 1 }

    CuisineRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }

    MenuItemRequest:
      type: object
      required: [stallId, name, category, description, price, preparationMinutes, isAvailable, cuisineIds]
      properties:
        stallId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 150 }
        category: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, minLength: 5, maxLength: 600 }
        price: { type: number, exclusiveMinimum: 0 }
        preparationMinutes: { type: integer, minimum: 1, maximum: 240 }
        isAvailable: { type: boolean }
        cuisineIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: integer, minimum: 1 }
        addOns:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              price: { type: number, minimum: 0 }

    PromotionRequest:
      type: object
      required: [stallId, name, description, discountType, discountValue, startDate, endDate]
      properties:
        stallId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 150 }
        description: { type: string, minLength: 5, maxLength: 500 }
        discountType: { type: string, enum: [Fixed, Percentage] }
        discountValue: { type: number, exclusiveMinimum: 0 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        menuItemIds:
          type: array
          maxItems: 100
          items: { type: integer, minimum: 1 }

    User:
      type: object
      properties:
        userId: { type: integer, example: 12 }
        fullName: { type: string, example: Alice Tan }
        email: { type: string, format: email, example: alice@example.sg }
        phone: { type: string, nullable: true, example: '91234567' }
        roleName: { $ref: '#/components/schemas/Role' }
        accountStatus: { type: string, enum: [Active, Deactivated, Suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stallId: { type: integer, nullable: true }
        centreId: { type: integer, nullable: true }

    AuthData:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: JWT access token }
        user: { $ref: '#/components/schemas/User' }

    AuthSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/AuthData' }

    UserSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/User' }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    ValidationError:
      description: Invalid request data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthenticationError:
      description: Authentication is required or the credentials/token are invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthorizationError:
      description: The authenticated account is not permitted to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFoundError:
      description: The requested account was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConflictError:
      description: Duplicate email or conflicting account state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
