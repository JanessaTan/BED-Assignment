<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browse Hawker Centres</title>
  <link rel="stylesheet" href="css/browse-hawkercentre.css" />
</head>
<body>
  <header>
    <h1>Browse Hawker Centres</h1>
  </header>

  <main>
    <section class="search-panel">
      <input type="text" id="searchInput" placeholder="e.g. Hawker centre in Clement" />
      <button id="searchBtn">Search</button>
      <button id="nearMeBtn">Near Me</button>
    </section>

    <p id="statusMessage"></p>

    <ul id="resultsList"></ul>
  </main>

  <script src="js/browse-hawkercentre.js"></script>
</body>
</html>
