<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Promotions – HawkerHub</title>

  <!-- Shared styles first, Promotion-page styles second -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/promotion.css">
</head>

<body>
  <!-- Shared HawkerHub navigation -->
  <script src="../JS/shared.js"></script>
  <script>
    renderHeader("promotions");
  </script>

  <main class="page-shell">
    <header class="page-header">
      <div class="page-header__content">
        <p class="eyebrow">Save More at HawkerHub</p>
        <h1 class="page-title">Latest Promotions</h1>
        <p class="page-subtitle">
          Discover special offers and tasty deals from your favourite hawker
          stalls.
        </p>
      </div>

      <a href="Stalls.html" class="btn outline mobile-full">
        Explore Stalls
      </a>
    </header>

    <!-- promotion.js updates this message while promotions are loading -->
    <div
      id="promotionStatus"
      class="status"
      role="status"
      aria-live="polite">
      Loading promotions...
    </div>

    <!-- promotion.js inserts promotion cards here -->
    <section
      id="promotionList"
      class="grid grid-2"
      aria-label="Available promotions">
    </section>
  </main>

  <!-- Load once, after promotionList and promotionStatus exist -->
  <script src="../JS/promotion.js"></script>
</body>

</html>
