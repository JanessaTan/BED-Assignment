<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a local HawkerHub demonstration account">
  <title>Register | HawkerHub</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/register.css">
  <script src="../js/shared.js" defer></script>
  <script src="../js/register.js" defer></script>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="page-shell" id="mainContent">
    <div class="page-heading">
      <div><span class="eyebrow">Local demonstration account</span><h1>Create your account</h1><p>Your information stays in this browser's localStorage.</p></div>
    </div>
    <section class="card register-card">
      <form class="form-grid" id="registerForm" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" autocomplete="name" required>
          <p class="field-error" id="fullNameError"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p class="field-error" id="emailError"></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>
          <p class="field-help">Use at least 8 characters with a letter and number.</p>
          <p class="field-error" id="passwordError"></p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
          <p class="field-error" id="confirmPasswordError"></p>
        </div>
        <div class="field field-full">
          <label for="accountType">Account type</label>
          <select id="accountType" name="accountType" required>
            <option value="">Select an account type</option>
            <option value="customer">Customer</option>
            <option value="vendor">Vendor</option>
            <option value="nea_officer">NEA Officer</option>
            <option value="operator">Operator</option>

          </select>
          <p class="field-error" id="accountTypeError"></p>
        </div>
        <div class="field field-full">
          <label class="terms" for="terms"><input id="terms" type="checkbox"> I understand this is a local front-end demonstration and agree to the demo terms.</label>
          <p class="field-error" id="termsError"></p>
        </div>
        <div class="field field-full">
          <button class="btn btn-primary" type="submit">Create account</button>
          <a class="btn btn-muted" href="login.html">Back to login</a>
        </div>
      </form>
      <p class="notice notice-info" id="registerMessage" role="status" hidden></p>
    </section>
  </main>
  <div id="siteFooter"></div>
</body>
</html>
