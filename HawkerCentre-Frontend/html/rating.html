<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View and submit stall ratings">
  <title>Ratings | HawkerHub</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/rating.css">
  <script src="../js/shared.js" defer></script>
  <script src="../js/rating.js" defer></script>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="page-shell" id="mainContent">
    <div class="page-heading"><div><span class="eyebrow">Customer voices</span><h1>Ratings and reviews</h1><p>Explore local demonstration reviews and add your own.</p></div></div>
    <section class="toolbar"><div class="field"><label for="ratingStall">Food stall</label><select id="ratingStall"></select></div>
      <div class="field"><label for="reviewSort">Sort reviews</label>
        <select id="reviewSort">
          <option value="newest">Newest first</option>
          <option value="highest">Highest rating</option>
          <option value="lowest">Lowest rating</option>
        </select>
      </div>
      <div class="field"><label for="reviewSort">Filter by Category</label>
        <select id="reviewSort">
          <option value="1">All</option>
          <option value="General">General</option>
          <option value="Compliment">Compliment</option>
          <option value="Complaint">Complaint</option>
          <option value="Suggestion">Suggestion</option>
        </select>
      </div>
      <div class="field"><label for="reviewSort">Filter by Subcategory</label>
        <select id="reviewSort">
          <option value="All">All</option>
          <option value="Misc.">Misc.</option>
          <option value="Hygiene">Hygiene</option>
          <option value="Environment">Environment</option>
          <option value="Food Quality">Food Quality</option>
          <option value="Portion Size">Portion Size</option>
          <option value="Price">Price</option>
          <option value="Service">Service</option>
          <option value="Wait Time">Wait Time</option>
        </select>
      </div>
  </section>
    <section class="rating-overview card" id="ratingOverview"></section>
    <div class="grid rating-layout">
      <section><div class="stack" id="reviewList"></div><div class="empty-state" id="reviewEmpty" hidden><h2>No reviews yet</h2><p>Be the first to leave a rating.</p></div></section>
      <form class="card form-grid" id="ratingForm" novalidate>
        <h2 class="field-full">Submit a rating</h2>
        <div class="field field-full"><label for="ratingValue">Rating</label><select id="ratingValue" required><option value="">Choose 1-5</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></div>
        <div class="field field-full"><label for="ratingComment">Review</label><textarea id="ratingComment" maxlength="300" required></textarea></div>
        <p class="field-error field-full" id="ratingError"></p>
        <button class="btn btn-primary field-full" type="submit">Submit rating</button>
      </form>
    </div>
  </main>
  <div id="siteFooter"></div>
</body>
</html>
