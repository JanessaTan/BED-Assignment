<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vendor performance dashboard">
  <title>Vendor Dashboard | HawkerHub</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/vendor-dashboard.css">
  <script src="../js/api.js" defer></script>
  <script src="../js/shared.js" defer></script>
  <script src="../js/vendor-dashboard.js" defer></script>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="page-shell" id="mainContent">
    <section class="vendor-hero"><div><span class="eyebrow">Vendor workspace</span><h1 id="vendorWelcome">Good afternoon.</h1><p>Monitor orders, revenue, ratings and menu availability from one place.</p></div><span class="badge badge-success" id="dashboardHygiene"></span></section>
    <section class="section"><div class="grid grid-4" id="vendorStats"></div></section>
    <section class="section dashboard-grid">
      <div class="card"><div class="section-heading"><div><h2>Pending orders</h2></div><a href="order.html">View all</a></div><div class="stack" id="pendingOrders"></div></div>
      <div class="card"><div class="section-heading"><div><h2>Popular items</h2></div></div><div class="stack" id="popularItems"></div></div>
    </section>
    <section class="section"><div class="section-heading"><div><h2>Quick actions</h2></div></div><div class="grid grid-4" id="vendorActions"></div></section>
  </main>
  <div id="siteFooter"></div>
</body>
</html>
