<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Complete a front-end simulated order">
  <title>Checkout | HawkerHub</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/checkout.css">
  <script src="../js/shared.js" defer></script>
  <script src="../js/checkout.js" defer></script>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="page-shell" id="mainContent">
    <div class="page-heading"><div><span class="eyebrow">Front-end simulation</span><h1>Checkout</h1><p>No real payment will be processed.</p></div></div>
    <div class="checkout-layout">
      <form class="card form-grid" id="checkoutForm" novalidate>
        <div class="field"><label for="customerName">Customer name</label><input id="customerName" autocomplete="name" required><p class="field-error" id="customerNameError"></p></div>
        <div class="field"><label for="phone">Contact number</label><input id="phone" inputmode="tel" placeholder="8-digit Singapore number" required><p class="field-error" id="phoneError"></p></div>
        <div class="field"><label for="collectionMethod">Collection method</label><select id="collectionMethod" required><option value="">Select method</option><option>Self collection</option><option>Dine in</option></select><p class="field-error" id="collectionMethodError"></p></div>
        <div class="field" id="pickupTimeGroup">
          <label for="pickupTime">Self-Collection Time</label>
          <input
              type="datetime-local"
              id="pickupTime"
              name="pickupTime">
          <span class="error-message" id="pickupTimeError"></span>
        </div>
        <div class="field"><label for="packaging">Packaging preference</label><select id="packaging" required><option value="">Select packaging</option><option>Standard</option><option>Eco-friendly</option><option>No disposable cutlery</option></select><p class="field-error" id="packagingError"></p></div>
        <div class="field field-full"><label for="notes">Order notes (optional)</label><textarea id="notes" maxlength="200" placeholder="Example: Less spicy"></textarea></div>
        <fieldset class="field field-full payment-options">
          <legend class="label">Payment method</legend>
          <div class="radio-row"><label for="paymentCash"><input id="paymentCash" type="radio" name="paymentMethod" value="Cash"> Cash</label><label for="paymentNets"><input id="paymentNets" type="radio" name="paymentMethod" value="NETS"> NETS</label><label for="paymentPaynow"><input id="paymentPaynow" type="radio" name="paymentMethod" value="PayNow"> PayNow</label></div>
          <p class="field-error" id="paymentMethodError"></p>
        </fieldset>
        <div class="field field-full"><button class="btn btn-primary" type="submit">Place demonstration order</button><a class="btn btn-muted" href="cart.html">Back to cart</a></div>
      </form>
      <aside class="card order-summary" id="checkoutSummary"></aside>
    </div>
  </main>
  <div id="siteFooter"></div>
</body>
</html>
