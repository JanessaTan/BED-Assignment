<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hawker centre operator dashboard">
  <title>Operator Dashboard | HawkerHub</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/operator-dashboard.css">
  <script src="../js/shared.js" defer></script>
  <script src="../js/operator-dashboard.js" defer></script>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="page-shell" id="mainContent">
    <section class="role-hero operator-hero"><div><span class="eyebrow">Centre administration</span><h1 id="operatorWelcome">Operator Dashboard</h1><p>Manage daily centre operations, stall status, rental agreements and customer complaints.</p></div><span class="badge badge-success">Centre operational</span></section>
    <section class="section"><div class="grid grid-4" id="operatorStats"></div></section>
    <section class="section"><div class="section-heading"><div><h2>Operator job scopes</h2><p>Quick access to the areas managed by the appointed hawker centre operator.</p></div></div><div class="grid grid-3" id="operatorActions"></div></section>
    <section class="section dashboard-grid"><article class="card"><h2>Rental alerts</h2><div class="stack" id="rentalAlerts"></div></article><article class="card"><h2>Recent complaints</h2><div class="stack" id="complaintAlerts"></div></article></section>
  </main>
  <div id="siteFooter"></div>
